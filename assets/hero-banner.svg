<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07080B"/>
      <stop offset="55%" stop-color="#0C0F16"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </linearGradient>

    <radialGradient id="glowEmerald" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 60) rotate(25) scale(460 260)">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 280) rotate(-18) scale(440 240)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowEmber" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 320) scale(340 160)">
      <stop offset="0%" stop-color="#FF7F45" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#FF7F45" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="52" y1="100" x2="520" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="68%" stop-color="#E6EDF3"/>
      <stop offset="100%" stop-color="#9BE7C4"/>
    </linearGradient>

    <linearGradient id="accentBeam" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00FF9D" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FF7F45" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#00FF9D" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.16"/>
    </linearGradient>

    <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.075"/>
    </pattern>

    <clipPath id="canvasClip">
      <rect x="1" y="1" width="1198" height="338" rx="20"/>
    </clipPath>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.85); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .dot-pulse {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse 2.2s ease-in-out infinite;
      }
      .cursor-blink {
        animation: blink 1.05s steps(1, end) infinite;
      }
      .beam-glide {
        animation: shimmer 6.5s linear infinite;
      }
    </style>
  </defs>

  <g clip-path="url(#canvasClip)">
    <rect width="1200" height="340" fill="url(#bgGrad)"/>
    <rect width="1200" height="340" fill="url(#dotGrid)"/>
    <rect width="1200" height="340" fill="url(#glowEmerald)"/>
    <rect width="1200" height="340" fill="url(#glowCyan)"/>
    <rect width="1200" height="340" fill="url(#glowEmber)"/>

    <rect x="0" y="0" width="1200" height="2" fill="url(#accentBeam)"/>
    <rect x="0" y="0" width="420" height="2" fill="url(#accentBeam)" class="beam-glide"/>

    <!-- LEFT COLUMN -->
    <rect x="52" y="38" width="328" height="28" rx="14" fill="#00FF9D" fill-opacity="0.08" stroke="#00FF9D" stroke-opacity="0.28"/>
    <circle cx="70" cy="52" r="4" fill="#00FF9D" class="dot-pulse"/>
    <text x="83" y="56" fill="#A7F3D0" font-size="11.5" font-weight="600" letter-spacing="0.8" class="mono">SHIPPING PRODUCTION WEB · GURUGRAM</text>

    <text x="52" y="132" fill="url(#nameGrad)" font-size="52" font-weight="800" letter-spacing="-1.6" class="sans">Tanishq Sethi</text>

    <rect x="408" y="99" width="114" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="465" y="119" text-anchor="middle" fill="#38BDF8" font-size="13" font-weight="700" class="mono">@intrance7</text>

    <text x="52" y="168" fill="#00FF9D" font-size="19" font-weight="600" letter-spacing="-0.2" class="sans">Full-Stack Web Developer &amp; AI Security Engineer</text>

    <text x="52" y="202" fill="#9CA3AF" font-size="15" font-weight="400" class="sans">
      Architecting low-latency web platforms, tactile design systems, and
    </text>
    <text x="52" y="224" fill="#9CA3AF" font-size="15" font-weight="400" class="sans">
      explainable AI security tooling — from PostgreSQL internals to 60fps UI.
    </text>

    <g transform="translate(52, 256)">
      <rect x="0" y="0" width="174" height="34" rx="10" fill="#131722" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <circle cx="16" cy="17" r="3.5" fill="#38BDF8"/>
      <text x="28" y="21" fill="#E5E7EB" font-size="12" font-weight="600" class="mono">Next.js · TypeScript</text>

      <rect x="186" y="0" width="178" height="34" rx="10" fill="#131722" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <circle cx="202" cy="17" r="3.5" fill="#00FF9D"/>
      <text x="214" y="21" fill="#E5E7EB" font-size="12" font-weight="600" class="mono">FastAPI · XAI · YARA</text>

      <rect x="376" y="0" width="172" height="34" rx="10" fill="#131722" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <circle cx="392" cy="17" r="3.5" fill="#FF7F45"/>
      <text x="404" y="21" fill="#E5E7EB" font-size="12" font-weight="600" class="mono">Postgres · Redis</text>
    </g>

    <!-- RIGHT COLUMN: macOS Live Code Card -->
    <g transform="translate(658, 36)">
      <rect x="0" y="0" width="490" height="268" rx="16" fill="#0D1117" fill-opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <path d="M0 16C0 7.16344 7.16344 0 16 0H474C482.837 0 490 7.16344 490 16V38H0V16Z" fill="#161B22"/>
      <line x1="0" y1="38" x2="490" y2="38" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <circle cx="20" cy="19" r="5.5" fill="#FF5F56"/>
      <circle cx="38" cy="19" r="5.5" fill="#FFBD2E"/>
      <circle cx="56" cy="19" r="5.5" fill="#27C93F"/>
      <text x="245" y="23" text-anchor="middle" fill="#8B949E" font-size="12" font-weight="500" class="mono">intrance7 — engineer.config.ts</text>

      <g fill="#484F58" font-size="12.5" class="mono">
        <text x="18" y="66">1</text>
        <text x="18" y="89">2</text>
        <text x="18" y="112">3</text>
        <text x="18" y="135">4</text>
        <text x="18" y="158">5</text>
        <text x="18" y="181">6</text>
        <text x="18" y="204">7</text>
        <text x="18" y="227">8</text>
        <text x="18" y="250">9</text>
      </g>

      <g font-size="13" class="mono">
        <text x="44" y="66">
          <tspan fill="#FF7B72">export const</tspan>
          <tspan fill="#79C0FF"> engineer</tspan>
          <tspan fill="#E6EDF3"> = {</tspan>
        </text>
        <text x="62" y="89">
          <tspan fill="#D2A8FF">alias</tspan><tspan fill="#E6EDF3">: </tspan>
          <tspan fill="#A5D6FF">"inTR4NCE"</tspan><tspan fill="#E6EDF3">,</tspan>
        </text>
        <text x="62" y="112">
          <tspan fill="#D2A8FF">degree</tspan><tspan fill="#E6EDF3">: </tspan>
          <tspan fill="#A5D6FF">"B.Tech CSE (Cyber Security)"</tspan><tspan fill="#E6EDF3">,</tspan>
        </text>
        <text x="62" y="135">
          <tspan fill="#D2A8FF">flagships</tspan><tspan fill="#E6EDF3">: [</tspan>
          <tspan fill="#00FF9D">"AksharSetu"</tspan><tspan fill="#E6EDF3">, </tspan>
          <tspan fill="#00FF9D">"Zeravynex"</tspan><tspan fill="#E6EDF3">],</tspan>
        </text>
        <text x="62" y="158">
          <tspan fill="#D2A8FF">craft</tspan><tspan fill="#E6EDF3">: [</tspan>
          <tspan fill="#A5D6FF">"SSR Perf"</tspan><tspan fill="#E6EDF3">, </tspan>
          <tspan fill="#A5D6FF">"UI Systems"</tspan><tspan fill="#E6EDF3">, </tspan>
          <tspan fill="#A5D6FF">"XAI"</tspan><tspan fill="#E6EDF3">],</tspan>
        </text>
        <text x="62" y="181">
          <tspan fill="#D2A8FF">runtime</tspan><tspan fill="#E6EDF3">: </tspan>
          <tspan fill="#A5D6FF">"Node · Edge · Python · WASM"</tspan><tspan fill="#E6EDF3">,</tspan>
        </text>
        <text x="62" y="204">
          <tspan fill="#D2A8FF">philosophy</tspan><tspan fill="#E6EDF3">: </tspan>
          <tspan fill="#FFAB70">"Fast by default, secure by design"</tspan><tspan fill="#E6EDF3">,</tspan>
        </text>
        <text x="44" y="227">
          <tspan fill="#E6EDF3">} </tspan><tspan fill="#FF7B72">as const</tspan><tspan fill="#E6EDF3">;</tspan>
        </text>
        <text x="44" y="250">
          <tspan fill="#8B949E">// ready to build what matters</tspan>
        </text>
        <rect x="282" y="238" width="8" height="15" rx="1.5" fill="#00FF9D" class="cursor-blink"/>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="338" rx="20" stroke="url(#borderGrad)" stroke-width="1.2"/>
</svg>
